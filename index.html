<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimbos Goal Tracker Demo 1</title>
    <style>
        body { background-color: #1a1a1a; color: #d4d4d4; font-family: 'Trebuchet MS', Consolas, sans-serif; margin: 0; padding: 30px; }
        h1 { text-align: center; color: #ff981f; text-shadow: 2px 2px 0px #000; font-size: 2.5rem; margin-bottom: 20px; }
        
        .header-controls { text-align: center; margin-bottom: 30px; }
        .search-bar input { padding: 10px 15px; font-size: 1.1rem; border: 2px solid #3b3b3b; border-radius: 5px 0 0 5px; background: #242424; color: #fff; outline: none; width: 200px; }
        .search-bar button { padding: 10px 15px; font-size: 1rem; border: 2px solid #3b3b3b; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        #search-btn { background: #ff981f; border-color: #ff981f; color: #1a1a1a; border-radius: 0 5px 5px 0; }
        #search-btn:hover { background: #e6891c; }
        #retro-btn { background: #cc66ff; border-color: #cc66ff; color: #1a1a1a; border-radius: 5px; margin-left: 10px; }
        #wiki-btn { background: #00ff00; border-color: #00ff00; color: #1a1a1a; border-radius: 5px; margin-left: 10px; }

        .tab-container { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .tab-btn { background: #242424; border: 2px solid #3b3b3b; color: #888; padding: 10px 25px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .tab-btn.active { border-color: #ff981f; color: #ff981f; background: #3a2a18; }

        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }
        .master-list-container { max-width: 1000px; margin: auto; }
        .master-list-container .panel { max-height: 70vh; overflow-y: auto; }

        .panel { background-color: #242424; border: 2px solid #000; border-radius: 8px; padding: 20px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 4px 6px rgba(0,0,0,0.5); }
        .panel h2 { margin-top: 0; color: #ff981f; border-bottom: 2px solid #3b3b3b; padding-bottom: 10px; font-size: 1.3rem; }
        
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-right { display: flex; align-items: center; gap: 15px; }
        
        .item-icon { width: 25px; height: 25px; object-fit: contain; }
        .item-name { text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .item-name:hover { text-decoration: underline; }
        .time-label { color: #888; font-size: 0.95rem; }
        
        .Quest { color: #00ff00; } .Item { color: #ffff00; } .Unlock { color: #cc66ff; }
        .locked { color: #777 !important; }
        .locked-icon { opacity: 0.3; filter: grayscale(100%); }
        .lock-badge { font-size: 0.75rem; background: #3b1a1a; color: #ff4d4d; padding: 2px 6px; border-radius: 4px; border: 1px solid #552222; }

        .done-btn { background: transparent; border: 1px solid #00ff00; color: #00ff00; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-weight: bold; }
        .done-btn:hover { background: #00ff00; color: #1a1a1a; }
        .row-completing { opacity: 0.4; pointer-events: none; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #ff981f; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>IRONMAN DASHBOARD</h1>
    
    <div class="header-controls">
        <div class="search-bar">
            <input type="text" id="rsn" placeholder="OSRS Username...">
            <button id="search-btn" onclick="handleSearch()">Fetch Stats</button>
            <button id="retro-btn" onclick="retroSync()">Sync Drops</button>
            <button id="wiki-btn" onclick="wikiSync()">Sync Quests</button>
        </div>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab-btn" onclick="switchTab('all-tasks')">All Tasks</button>
        </div>
    </div>
    
    <div id="view-dashboard" class="view-section active">
        <div class="container">
            <div class="panel">
                <h2>Easy Wins (< 1 Hr)</h2>
                <div id="easy-wins">Loading...</div>
            </div>
            <div class="panel">
                <h2>Next Grind (Top Priority)</h2>
                <div id="next-grind">Loading...</div>
            </div>
        </div>
    </div>

    <div id="view-all-tasks" class="view-section">
        <div class="master-list-container">
            <div class="panel">
                <h2>Master Task List</h2>
                <div id="all-tasks">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // --- PASTE YOUR API URL HERE ---
        const API_URL = "https://script.google.com/macros/s/AKfycbwr5wXGuYywbH6TUaUkXHkg2YWCubc6ou0p333ZMRLeTDc5Dr0GRKn__sZs8mGXnER9/exec";

        function switchTab(target) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
            
            if (target === 'dashboard') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('view-dashboard').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('view-all-tasks').classList.add('active');
            }
        }

        async function handleAPIRequest(actionStr, btnId, loadingText) {
            const username = document.getElementById('rsn').value;
            if (!username) return alert("Enter Username first.");
            
            const btn = document.getElementById(btnId);
            const originalText = btn.innerText;
            btn.innerText = loadingText;
            
            try {
                // FIXED: Enforced text/plain to bypass Apps Script CORS blocks
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: actionStr, username: username })
                });
                const result = await response.json();
                
                if (result.status === "Success") {
                    btn.innerText = result.updated !== undefined ? `Synced ${result.updated}!` : "Success!";
                    await fetchOSRSData(); 
                } else {
                    btn.innerText = "Error/Not Found";
                }
                setTimeout(() => { btn.innerText = originalText; }, 4000);
            } catch (err) {
                btn.innerText = "Error!";
                setTimeout(() => { btn.innerText = originalText; }, 3000);
            }
        }

        function handleSearch() { handleAPIRequest("fetch_stats", "search-btn", "Syncing..."); }
        function retroSync() { handleAPIRequest("retro_sync", "retro-btn", "Reading Drops..."); }
        function wikiSync() { handleAPIRequest("wiki_sync", "wiki-btn", "Reading Quests..."); }

        async function markDone(buttonElement, milestoneName) {
            buttonElement.innerText = "⏳";
            const row = buttonElement.closest('.item-row');
            row.classList.add('row-completing');
            
            try {
                // FIXED: Enforced text/plain headers here as well
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "mark_done", milestoneName: milestoneName })
                });
                fetchOSRSData();
            } catch (err) {
                buttonElement.innerText = "❌";
                row.classList.remove('row-completing');
            }
        }

        async function fetchOSRSData() {
            try {
                const response = await fetch(API_URL);
                const rawData = await response.json();
                
                const parsedData = rawData.map(item => {
                    const reqsText = (item['Missing Reqs'] || "").toString().trim().toLowerCase();
                    return {
                        name: item['Milestone Name'] || item['Name'] || item['Milestone'] || "Unknown",
                        type: item['Type'] || "Item",
                        time: parseFloat(item['Time Taken']) || 0,
                        impact: parseInt(item['Milestones Unlocked']) || 0,
                        completed: item['Completed'] === true || item['Completed'] === "TRUE" || item['Completed'] === "true",
                        isReqsMet: (reqsText === "all reqs met!" || reqsText === "all reqs met" || reqsText === "none" || reqsText === "")
                    };
                });

                const incomplete = parsedData.filter(i => !i.completed);
                
                let easyWins = incomplete.filter(i => i.isReqsMet && i.time <= 1);
                easyWins.sort((a, b) => a.time - b.time);
                renderList("easy-wins", easyWins.slice(0, 10));

                let nextGrind = incomplete.filter(i => i.isReqsMet && i.impact > 0);
                nextGrind.sort((a, b) => b.impact - a.impact || a.time - b.time);
                renderList("next-grind", nextGrind.slice(0, 10));

                let allTasks = [...incomplete];
                allTasks.sort((a, b) => a.name.localeCompare(b.name));
                renderList("all-tasks", allTasks);

            } catch (error) {
                document.querySelectorAll('[id$="-wins"], [id$="-grind"], [id$="all-tasks"]').forEach(el => {
                    el.innerHTML = `<span style="color:#ff4d4d;">Failed to load data.</span>`;
                });
            }
        }

        function renderList(elementId, items) {
            const container = document.getElementById(elementId);
            container.innerHTML = "";
            
            if (items.length === 0) {
                container.innerHTML = "<div class='time-label' style='padding:10px 0;'>No active tasks.</div>";
                return;
            }

            items.forEach(item => {
                const isLocked = !item.isReqsMet;
                const textClass = isLocked ? "locked" : "";
                const imgClass = isLocked ? "locked-icon" : "";
                const lockBadge = isLocked ? `<span class="lock-badge">🔒 Locked</span>` : "";
                
                const safeName = item.name.replace(/ /g, '_');
                let imgSrc;
                
                // FIXED: Catch Quests and Unlocks to prevent CORB image spam
                if (item.type === "Quest") {
                    imgSrc = "https://oldschool.runescape.wiki/images/Quest_icon.png";
                } else if (item.type === "Unlock" || item.name.includes("Diary")) {
                    imgSrc = "https://oldschool.runescape.wiki/images/Achievement_Diaries_icon.png";
                } else {
                    imgSrc = `https://oldschool.runescape.wiki/wiki/Special:FilePath/${safeName}.png`;
                }

                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <div class="item-left">
                        <img src="${imgSrc}" class="item-icon ${imgClass}" onerror="this.style.display='none'">
                        <a href="https://oldschool.runescape.wiki/w/${safeName}" target="_blank" 
                           class="item-name ${item.type} ${textClass}">
                           ${item.name}
                        </a>
                        ${lockBadge}
                    </div>
                    <div class="item-right">
                        <span class="time-label">${item.time} Hrs</span>
                        <button class="done-btn" onclick="markDone(this, '${item.name}')">✓</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        fetchOSRSData();
    </script>
</body>
</html>
